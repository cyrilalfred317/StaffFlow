<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StaffFlow</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header>
      <h1>StaffFlow Workforce Management</h1>
      <p>Workforce Management Dashboard</p>
    </header>

    <main>
      <section>
        <h2>Add Employee</h2>

        <form id="employee-form">
          <div>
            <label for="employee-name">Name</label>
            <input type="text" id="employee-name" required />
          </div>

          <div>
            <label for="employee-role">Role</label>

            <select id="employee-role" required>
              <option value="">Select role</option>
              <option value="Dev">Developer</option>
              <option value="Designer">Designer</option>
              <option value="Manager">Manager</option>
            </select>
          </div>

          <div>
            <label for="employee-salary">Salary</label>

            <input type="number" id="employee-salary" min="1" required />
          </div>
          <div>
            <label for="employee-detail" id="detail-label"> Role Detail </label>
            <input type="text" id="employee-detail" required />
          </div>

          <button type="submit" id="add-employee">Add Employee</button>
        </form>
      </section>

      <section>
        <h2>Employees</h2>

        <div id="employee-list"></div>
      </section>
    </main>

    <script type="module" src="./js/main.ts"></script>
  </body>
</html>
